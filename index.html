<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>SowèlSoft — Web & App Development</title>
    <meta name="description" content="Jasa pembuatan website, dashboard, dan aplikasi untuk UMKM dan perusahaan.">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] }, colors: { navy: '#0f1f3d', soft: '#f3f7fd' } } } }
    </script>
    <style>
      .draw {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: dr 1.6s .3s ease forwards
      }

      .bars rect {
        transform-box: fill-box;
        transform-origin: bottom;
        animation: gr .7s 1.3s both
      }

      @keyframes dr {
        to {
          stroke-dashoffset: 0
        }
      }

      @keyframes gr {
        from {
          transform: scaleY(0)
        }
      }

      .rv {
        opacity: 0;
        translate: 0 14px
      }

      .rv.in {
        opacity: 1;
        translate: 0 0
      }

      @media(prefers-reduced-motion:reduce) {
        .draw {
          animation: none;
          stroke-dashoffset: 0
        }

        .bars rect {
          animation: none
        }

        .rv {
          opacity: 1;
          translate: none
        }
      }
    </style>
  </head>

  <body class="bg-white text-slate-900 font-sans antialiased">
    <div id="app"></div>
    <script>
      /* Class yang dipakai berulang: ubah di sini, berlaku di seluruh halaman */
      const W = "max-w-6xl mx-auto px-6", CARD = "bg-white border border-slate-200 rounded-xl p-5 transition hover:-translate-y-0.5 hover:shadow-md",
        LABEL = "text-xs font-semibold uppercase tracking-wider text-slate-500",
        H2 = "text-2xl font-bold text-slate-900 mt-1 mb-2", SUB = "text-sm text-slate-500 max-w-lg",
        BTN = "inline-flex items-center gap-2 rounded-lg px-5 py-2.5 text-sm font-semibold border transition",
        B1 = BTN + " bg-blue-600 border-blue-600 text-white hover:bg-blue-700",
        B2 = BTN + " bg-white border-slate-200 text-slate-800 hover:border-blue-600",
        BWA = BTN + " bg-green-600 border-green-600 text-white hover:bg-green-700",
        SEC = "py-14", NAV = "py-[22px] border-b-2 border-transparent hover:text-blue-600 hover:border-blue-600";
      const $ = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

      fetch("content.json").then(r => r.json()).then(c => {
        const s = c.site, h = c.hero, svc = c.services, pf = c.portfolio, w = c.why, p = c.pricing,
          wa = `https://wa.me/${s.whatsapp}?text=${encodeURIComponent(s.waMessage)}`,
          ext = 'target="_blank" rel="noopener"',
          navItems = [["beranda", "Beranda"], ["layanan", "Layanan"], ["portfolio", "Portfolio"], ["tentang", "Tentang"]];
        document.getElementById("app").innerHTML = `
<header class="sticky top-0 z-10 bg-white/95 backdrop-blur border-b border-slate-200">
 <div class="${W} flex h-[68px] items-center justify-between">
  <a href="#" class="flex items-center gap-2.5 font-bold leading-tight"><span class="font-mono text-xl text-blue-600">&lt;/&gt;</span><span>${$(s.name)}<small class="block text-[11px] font-normal text-slate-500">${$(s.tagline)}</small></span></a>
  <nav class="hidden md:flex gap-7 text-sm font-medium">${navItems.map(([k, t]) => `<a data-nav="${k}" class="${NAV}" href="#${k}">${t}</a>`).join("")}</nav>
  <div class="flex items-center gap-2"><a href="${wa}" ${ext} class="${B1} !py-2 !px-4 !text-[13px]">💬 Hubungi Saya</a>
   <button id="menuBtn" aria-expanded="false" aria-label="Menu" class="grid h-10 w-10 place-items-center rounded-lg border border-slate-200 md:hidden">☰</button></div>
 </div>
 <div id="mobileMenu" class="hidden border-t border-slate-200 bg-white md:hidden"><div class="${W} flex flex-col py-2 text-sm font-medium">${navItems.map(([k, t]) => `<a class="py-3" href="#${k}">${t}</a>`).join("")}</div></div>
</header>

<section id="beranda" class="bg-gradient-to-br from-white to-blue-50 py-16">
 <div class="${W} grid items-center gap-10 lg:grid-cols-[1.1fr_1fr]">
  <div>
   <h1 class="text-4xl lg:text-[44px] font-extrabold leading-[1.15] tracking-tight">${$(h.title)}<span class="block text-blue-600">${$(h.highlight)}</span></h1>
   <p class="mt-5 mb-7 max-w-md text-slate-600">${$(h.text)}</p>
   <div class="flex flex-wrap gap-3"><a href="${wa}" ${ext} class="${B1}">💬 ${$(h.cta1)}</a><a href="#portfolio" class="${B2}">${$(h.cta2)} →</a></div>
  </div>
  <div class="relative max-w-md pl-8 pt-6" aria-hidden="true">
   <div class="absolute right-0 top-0 max-w-[160px] text-right text-sm text-slate-500" style="font-family:'Segoe Script','Brush Script MT',cursive">${$(h.note)}</div>
   <div class="rounded-t-xl rounded-b bg-navy p-2.5 pb-3.5 shadow-2xl shadow-slate-400/50">
    <div class="grid h-52 grid-cols-[44px_1fr] overflow-hidden rounded-md bg-white">
     <i class="bg-navy"></i>
     <div class="p-3"><div class="mb-2 h-2 w-2/5 rounded bg-slate-200"></div>
      <svg viewBox="0 0 200 80" preserveAspectRatio="none" class="h-28 w-full"><polyline pathLength="1" class="draw" fill="none" stroke="#2563eb" stroke-width="2" points="0,60 30,48 60,55 90,30 120,40 150,18 200,10"/><g fill="#2563eb" class="bars"><rect x="140" y="50" width="8" height="30"/><rect x="154" y="40" width="8" height="40"/><rect x="168" y="30" width="8" height="50"/><rect x="182" y="20" width="8" height="60"/></g></svg>
      <div class="mb-2 h-2 w-[70%] rounded bg-slate-200"></div><div class="h-2 w-[55%] rounded bg-slate-200"></div></div>
    </div>
   </div>
   <div class="absolute -bottom-3 left-0 h-36 w-20 rounded-2xl bg-navy p-1.5 shadow-xl"><div class="h-full rounded-xl bg-gradient-to-b from-blue-100 to-white"></div></div>
  </div>
 </div>
</section>

<section id="layanan" class="${SEC}"><div class="${W}">
 <div class="${LABEL}">${$(svc.label)}</div><h2 class="${H2}">${$(svc.title)}</h2><p class="${SUB}">${$(svc.text)}</p>
 <div class="mt-7 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-6">
  ${svc.items.map(i => `<div class="${CARD}"><div class="mb-3.5 grid h-11 w-11 place-items-center rounded-full text-xl" style="background:${$(i.color)}22">${$(i.icon)}</div><h3 class="text-sm font-bold">${$(i.title)}</h3><p class="mt-1 text-xs text-slate-500">${$(i.text)}</p></div>`).join("")}
 </div>
</div></section>

<section id="portfolio" class="${SEC} bg-soft"><div class="${W}">
 <div class="flex items-end justify-between gap-4"><div><div class="${LABEL}">${$(pf.label)}</div><h2 class="${H2}">${$(pf.title)}</h2><p class="${SUB}">${$(pf.text)}</p></div>
  <a href="${$(pf.linkUrl)}" class="shrink-0 text-[13px] font-semibold text-blue-600 hover:underline">${$(pf.linkText)} →</a></div>
 <div id="filters" class="mt-6 flex flex-wrap gap-2">${["Semua", ...new Set(pf.items.flatMap(i => i.tech))].map((t, n) => `<button data-t="${$(t)}" class="rounded-full border px-4 py-1.5 text-xs font-semibold transition ${n ? "border-slate-200 bg-white hover:border-blue-600" : "border-blue-600 bg-blue-600 text-white"}">${$(t)}</button>`).join("")}</div>
 <div id="pgrid" class="mt-5 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
  ${pf.items.map((i, n) => `<article role="button" tabindex="0" data-i="${n}" data-tech="${$(i.tech.join("|"))}" class="${CARD} flex cursor-pointer flex-col overflow-hidden !p-0 hover:-translate-y-1 hover:shadow-lg">
   <div class="relative h-28 bg-cover bg-center" style="background-color:${$(i.color)};${i.image ? `background-image:url('${$(i.image)}')` : ""}">${i.image ? "" : `<div class="absolute inset-x-3.5 bottom-0 top-3.5 rounded-t-md" style="background:repeating-linear-gradient(#fff3 0 6px,transparent 6px 14px)"></div>`}</div>
   <div class="flex flex-1 flex-col p-4"><h3 class="text-sm font-bold">${$(i.title)}</h3><p class="mt-1 text-xs text-slate-500">${$(i.text)}</p>
    <ul class="my-3 flex-1 space-y-1 text-xs text-slate-500">${i.features.map(f => `<li><span class="mr-1.5 font-bold text-emerald-500">✓</span>${$(f)}</li>`).join("")}</ul>
    <div class="flex flex-wrap gap-1.5">${i.tech.map(t => `<span class="rounded-md border border-slate-200 bg-soft px-2.5 py-0.5 text-[11px] font-semibold">${$(t)}</span>`).join("")}</div></div></article>`).join("")}
 </div>
</div></section>

<section id="tentang" class="${SEC}"><div class="${W} grid gap-14 lg:grid-cols-2">
 <div><div class="${LABEL}">${$(w.label)}</div><h2 class="${H2}">${$(w.title)}</h2>
  <div class="mt-7 grid gap-7 sm:grid-cols-2">${w.items.map(i => `<div class="flex gap-3.5"><div class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-soft text-xl">${$(i.icon)}</div><div><h3 class="text-sm font-bold">${$(i.title)}</h3><p class="text-xs text-slate-500">${$(i.text)}</p></div></div>`).join("")}</div></div>
 <div><h2 class="text-xl font-bold">${$(w.techTitle)}</h2><p class="${SUB} mt-1">${$(w.techText)}</p>
  <div class="mt-6 grid grid-cols-4 gap-x-2.5 gap-y-5">${w.tech.map(t => `<div class="text-center text-xs font-semibold"><b class="mx-auto mb-1.5 grid h-11 w-11 place-items-center rounded-xl border border-slate-200 bg-soft text-[15px] text-blue-600">${$(t.slice(0, 2))}</b>${$(t)}</div>`).join("")}</div></div>
</div></section>

<section class="${SEC} bg-soft"><div class="${W} grid items-start gap-10 lg:grid-cols-[1fr_1.6fr]">
 <div><div class="${LABEL}">${$(p.label)}</div><h2 class="${H2}">${$(p.title)}</h2><p class="${SUB}">${$(p.text)}</p></div>
 <div class="grid grid-cols-1 gap-3.5 sm:grid-cols-2 xl:grid-cols-4">
  ${p.items.map(i => `<div class="${CARD}"><h3 class="text-sm font-bold">${$(i.title)}</h3><p class="mt-1 text-xs text-slate-500">${$(i.text)}</p><small class="mt-3 block text-[11px] text-slate-500">Mulai dari</small><div class="text-lg font-extrabold text-blue-600">${$(i.price)}</div><div class="text-[11px] text-slate-500">${$(i.note)}</div></div>`).join("")}
  <div class="${CARD}"><h3 class="text-sm font-bold">${$(p.customTitle)}</h3><p class="mt-1 mb-4 text-xs text-slate-500">${$(p.customText)}</p><a href="${wa}" ${ext} class="${B1} !px-4 !py-2 !text-[13px]">💬 ${$(p.customCta)}</a></div>
 </div>
</div></section>

<section class="bg-navy py-8 text-white"><div class="${W} flex flex-wrap items-center justify-between gap-5">
 <div class="flex items-center gap-4"><div class="grid h-14 w-14 place-items-center rounded-full bg-blue-600 text-2xl">💬</div><div><h3 class="text-lg font-bold">${$(c.cta.title)}</h3><p class="text-[13px] text-slate-300">${$(c.cta.text)}</p></div></div>
 <a href="${wa}" ${ext} class="${BWA}">💬 ${$(c.cta.button)} →</a>
</div></section>

<footer class="py-7 text-sm"><div class="${W} flex flex-wrap items-center justify-between gap-4">
 <div class="font-bold leading-tight">${$(s.name)}<small class="block text-[11px] font-normal text-slate-500">${$(s.tagline)}</small></div>
 <nav class="flex flex-wrap gap-5 text-xs"><a href="#beranda">Beranda</a><a href="#layanan">Layanan</a><a href="#portfolio">Portfolio</a><a href="#tentang">Tentang</a><a href="${wa}">Kontak</a></nav>
 <div class="text-right"><div class="flex justify-end gap-4 font-semibold"><a href="${wa}">WhatsApp</a><a href="${$(s.github)}">GitHub</a><a href="${$(s.linkedin)}">LinkedIn</a></div><small class="text-slate-500">${$(c.footer.copyright)}</small></div>
</div></footer>
<a href="${wa}" ${ext} aria-label="Chat WhatsApp" class="fixed bottom-5 right-5 z-20 grid h-14 w-14 place-items-center rounded-full bg-green-600 text-2xl text-white shadow-lg transition hover:scale-110">💬</a>
<div id="modal" class="fixed inset-0 z-30 hidden items-center justify-center bg-slate-900/60 p-4" role="dialog" aria-modal="true"><div class="relative max-h-full w-full max-w-lg overflow-auto rounded-2xl bg-white p-6 shadow-2xl"><button id="mClose" aria-label="Tutup" class="absolute right-3 top-3 grid h-9 w-9 place-items-center rounded-full hover:bg-slate-100">✕</button><div id="modalBody"></div></div></div>`;
        const q = x => document.querySelector(x), qa = x => [...document.querySelectorAll(x)];
        /* menu mobile */
        const mb = q("#menuBtn"), mm = q("#mobileMenu"), shut = () => { mm.classList.add("hidden"); mb.textContent = "☰"; mb.setAttribute("aria-expanded", "false") };
        mb.onclick = () => { const o = mm.classList.toggle("hidden"); mb.textContent = o ? "☰" : "✕"; mb.setAttribute("aria-expanded", String(!o)) };
        qa("#mobileMenu a").forEach(a => a.onclick = shut);
        /* menu aktif sesuai posisi scroll */
        const secs = navItems.map(([k]) => document.getElementById(k)), navs = qa("[data-nav]");
        const spy = () => {
          let cur = "beranda"; secs.forEach(x => { if (x.getBoundingClientRect().top < 120) cur = x.id });
          navs.forEach(a => { const on = a.dataset.nav === cur; a.classList.toggle("text-blue-600", on); a.classList.toggle("border-blue-600", on); a.classList.toggle("border-transparent", !on) })
        };
        addEventListener("scroll", spy, { passive: true }); spy();
        /* filter portfolio */
        qa("#filters button").forEach(b => b.onclick = () => {
          qa("#filters button").forEach(x => { const on = x === b; x.classList.toggle("bg-blue-600", on); x.classList.toggle("text-white", on); x.classList.toggle("border-blue-600", on); x.classList.toggle("bg-white", !on); x.classList.toggle("border-slate-200", !on) });
          qa("#pgrid article").forEach(a => a.classList.toggle("hidden", b.dataset.t !== "Semua" && !a.dataset.tech.split("|").includes(b.dataset.t)))
        });
        /* detail project (modal) */
        const md = q("#modal"), closeM = () => { md.classList.add("hidden"); md.classList.remove("flex"); document.body.classList.remove("overflow-hidden") };
        const openM = n => {
          const i = pf.items[n], u = `https://wa.me/${s.whatsapp}?text=${encodeURIComponent("Halo, saya tertarik dengan project seperti: " + i.title)}`;
          q("#modalBody").innerHTML = `<div class="mb-4 h-32 rounded-xl bg-cover bg-center" style="background-color:${$(i.color)};${i.image ? `background-image:url('${$(i.image)}')` : ""}"></div><h3 class="text-lg font-bold">${$(i.title)}</h3><p class="mt-1 text-sm text-slate-500">${$(i.text)}</p><ul class="my-4 space-y-1.5 text-sm text-slate-600">${i.features.map(f => `<li><span class="mr-2 font-bold text-emerald-500">✓</span>${$(f)}</li>`).join("")}</ul><div class="mb-5 flex flex-wrap gap-1.5">${i.tech.map(t => `<span class="rounded-md border border-slate-200 bg-soft px-2.5 py-0.5 text-[11px] font-semibold">${$(t)}</span>`).join("")}</div><a href="${u}" ${ext} class="${B1}">💬 Diskusikan project serupa</a>`;
          md.classList.remove("hidden"); md.classList.add("flex"); document.body.classList.add("overflow-hidden"); q("#mClose").focus()
        };
        qa("#pgrid article").forEach(a => { a.onclick = () => openM(+a.dataset.i); a.onkeydown = e => { if (e.key === "Enter") openM(+a.dataset.i) } });
        md.onclick = e => { if (e.target === md) closeM() }; q("#mClose").onclick = closeM; addEventListener("keydown", e => { if (e.key === "Escape") closeM() });
        /* kartu layanan muncul bertahap */
        const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { const el = e.target; el.classList.add("in"); io.unobserve(el); setTimeout(() => { el.classList.remove("rv", "in"); el.style.transition = el.style.transitionDelay = "" }, 1000) } }), { threshold: .15 });
        qa("#layanan .grid>div").forEach((el, n) => { el.classList.add("rv"); el.style.transition = "opacity .5s,translate .5s"; el.style.transitionDelay = n * 70 + "ms"; io.observe(el) });
        document.title = `${s.name} — ${s.tagline}`;
      }).catch(e => { document.getElementById("app").innerHTML = '<p class="p-10">Gagal memuat content.json. Jalankan lewat server (<code>python3 -m http.server</code>) atau deploy ke GitHub Pages.</p>'; console.error(e) });
    </script>
  </body>

</html>
